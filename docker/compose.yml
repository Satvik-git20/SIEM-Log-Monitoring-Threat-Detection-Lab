# =============================================================================
# SOC-Lab: SIEM Log Monitoring & Threat Detection Platform
# Docker Compose path for Elasticsearch + Kibana + Fleet Server.
#
# VERIFIED AGAINST Elastic Stack 9.5.3 (GA, 2026-09-03):
#   - image tags docker.elastic.co/elasticsearch/elasticsearch:9.5.3
#   - image tags docker.elastic.co/kibana/kibana:9.5.3
#   - image tag  docker.elastic.co/beats/elastic-agent:9.5.3
#   - Fleet Server host/port/env contract per Elastic Agent 9.x documentation
#
# This file is the RECOMMENDED path for any reviewer who has Docker.
# The lab this repository was built on had no Docker installed, so the
# stack was deployed natively from the vendor ZIPs instead. Both paths
# produce an identical data model; see docs/installation.md for the
# native (non-Docker) procedure and architecture/deviations.md for why.
#
# USAGE
#   cp .env.example .env
#   docker compose up -d
#   docker compose ps
#   ../scripts/validation/Test-ElasticStackHealth.ps1
#
# SECURITY POSTURE (local lab)
#   - ES/Kibana/Fleet publish to 127.0.0.1 only, via the *bind* port syntax.
#     This does NOT stop other containers reaching them, but nothing outside
#     the host can. Do not change to 0.0.0.0 on a shared network.
#   - xpack.security.enabled=true with a password from .env.
#   - HTTP/TLS is DISABLED because every listener is loopback-bound on a
#     single-user workstation. This is a documented lab deviation, not a
#     production pattern. See docs/configuration.md#tls-deviation.
# =============================================================================

name: soc-lab

services:

  # ---------------------------------------------------------------------------
  # Elasticsearch - single node, security enabled, persistent data volume
  # ---------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-9.5.3}
    container_name: soc-lab-elasticsearch
    environment:
      # Password for the built-in `elastic` superuser. NEVER hardcode a real
      # value here - it comes from .env which is gitignored.
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env}
      - node.name=soc-lab-es01
      - cluster.name=${ES_CLUSTER_NAME:-soc-lab-cluster}
      # Single-node lab: no bootstrap checks, no transport TLS required
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      # Bound to loopback: the container only accepts local traffic
      - network.host=0.0.0.0
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.license.self_generated.type=basic
      # Keep the lab cluster from trying to phone home for version checks
      - cluster.routing.allocation.disk.watermark.low=85%
      - cluster.routing.allocation.disk.watermark.high=90%
      - cluster.routing.allocation.disk.watermark.flood_stage=95%
      # Slow-scope warnings are noise on a laptop; log only errors in steady state
      - logger.org.elasticsearch.discovery.tag=INFO
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      # <host>:<container> - 127.0.0.1 host side is the security control
      - "${ES_BIND_ADDRESS:-127.0.0.1}:9200:9200"
      - "${ES_BIND_ADDRESS:-127.0.0.1}:9300:9300"
    healthcheck:
      # Uses the elastic superuser from .env. Without auth this check would
      # pass even if the security layer were broken.
      test: >
        CMD-SHELL
        curl -s -u "elastic:$${ELASTIC_PASSWORD}"
        http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s
        | grep -qE '"status":"(green|yellow)"'
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    restart: unless-stopped
    networks:
      - soc-lab

  # ---------------------------------------------------------------------------
  # Kibana - depends on ES being healthy, never starts against a dead cluster
  # ---------------------------------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:-9.5.3}
    container_name: soc-lab-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # Lab-only: reuse the `elastic` superuser. In production Kibana uses a
      # scoped `kibana_system` credential, never `elastic`.
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env}
      - SERVER_PUBLICBASEURL=http://localhost:5601
      - SERVER_HOST=0.0.0.0
      # Binding inside the container must be 0.0.0.0 or the port publish fails;
      # the 127.0.0.1 on the host side below is the actual network control.
      - SERVER_BIND_HOST=0.0.0.0
      - TELEMETRY_ENABLED=false
      # Lab does not ship telemetry anywhere
      - XPACK_FLEET_ENABLE_FLEET_SERVER_POLICY_STATUS=true
      - XPACK_FLEET_AGENTS_ENABLED=true
      - XPACK_FLEET_AGENTS_ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # Allow Fleet to reach ES over plain HTTP inside the compose network only
      - XPACK_FLEET_AGENTS_FLEET_SERVER_HOSTS=http://fleet-server:8220
      # Lab: allow self-signed Fleet Server for local enrollment
      - XPACK_FLEET_AGENTS_ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=
      - XPACK_FLEET_AGENTS_FLEET_SERVER_SSL_CERTIFICATEAUTHORITIES=
      - XPACK_FLEET_AGENTS_FLEET_SERVER_SSL_ENABLED=false
    ports:
      - "${KIBANA_BIND_ADDRESS:-127.0.0.1}:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: >
        CMD-SHELL
        curl -s http://localhost:5601/api/status
        | grep -qE '"overall\.level":"available"'
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped
    networks:
      - soc-lab

  # ---------------------------------------------------------------------------
  # Fleet Server - the control plane agents enroll against
  # Runs in policy mode (Fleet Server as an agent with an integration),
  # which is the modern Elastic Agent contract for 8.x/9.x.
  # ---------------------------------------------------------------------------
  fleet-server:
    image: docker.elastic.co/beats/elastic-agent:${STACK_VERSION:-9.5.3}
    container_name: soc-lab-fleet-server
    user: root
    environment:
      - FLEET_ENROLL=1
      # Agent runs as a managed agent; Fleet Server is added as an integration
      - KIBANA_FLEET_SETUP=1
      - KIBANA_FLEET_HOST=http://kibana:5601
      - KIBANA_FLEET_USERNAME=elastic
      - KIBANA_FLEET_PASSWORD=${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env}
      - FLEET_SERVER_ELASTICSEARCH_HOST=http://elasticsearch:9200
      - FLEET_SERVER_ELASTICSEARCH_USERNAME=elastic
      - FLEET_SERVER_ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env}
      - FLEET_SERVER_HOST=0.0.0.0
      - FLEET_SERVER_PORT=8220
      - FLEET_SERVER_POLICY_ID=fleet-server-policy
      - FLEET_SERVER_INSECURE_HTTP=1
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_started
    volumes:
      - fleet-data:/usr/share/elastic-agent/state
    ports:
      # Enrollment endpoint for the Windows + Linux agents. Loopback-only:
      # the Windows agent runs on this host, and the WSL2 agent is reached
      # over the WSL virtual NIC (see docs/configuration.md#wsl-networking).
      - "${FLEET_SERVER_HOST:-127.0.0.1}:${FLEET_SERVER_PORT:-8220}:8220"
    restart: unless-stopped
    networks:
      - soc-lab

networks:
  soc-lab:
    name: soc-lab-net
    driver: bridge

volumes:
  es-data:
    name: soc-lab-es-data
  fleet-data:
    name: soc-lab-fleet-data
